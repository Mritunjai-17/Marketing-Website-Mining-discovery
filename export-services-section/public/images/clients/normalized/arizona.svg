<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="azGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="azSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>
  <g transform="translate(55, 17)">
    <!-- Square Emblem with AZ -->
    <g transform="translate(0, 8)">
      <rect x="0" y="0" width="68" height="68" rx="14" fill="#0F172A" />
      <polygon points="8,8 60,8 8,60" fill="url(#azGold)" />
      <polygon points="60,8 60,60 8,60" fill="url(#azSilver)" />
      <rect x="18" y="18" width="32" height="32" rx="6" fill="#0F172A" />
      <text x="34" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">AZ</text>
    </g>
    <!-- Text -->
    <text x="82" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#0F172A">ARIZONA</text>
    <text x="84" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#B45309">GOLD &amp; SILVER</text>
  </g>
